limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
  listen 80;
  server_name _;

  # Serve the new HTML/CSS/JS frontend as the default UI.
  root /usr/share/nginx/html;
  index index.html;

  # Flutter web SPA fallback for any route not handled by the HTML app.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Disable aggressive caching for JS files so updates take effect immediately without stale browser cache errors
  location ~* \.(?:css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|ico)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, no-cache";
  }

  location ~* \.js$ {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # Keep the previous Flutter web build available under /flutter/.
  location /flutter/ {
    alias /usr/share/nginx/html/flutter/;
    try_files $uri $uri/ /flutter/index.html =404;
  }

  # Proxy API requests to the FastAPI backend.
  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy health route explicitly
  location /health {
    proxy_pass http://api:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
